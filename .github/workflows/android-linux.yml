name: Android-Linux

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'Stable*'
      - 'feature/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/android-linux.yml'
      - 'deploy/android/**'
      - 'src/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'translations/*'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT: QGroundControl.apk
      PACKAGE: QGroundControl
      QT_VERSION: 6.8.3
      # With the ANDROID_KEYSTORE_PASSWORD secret: the repository release keystore.
      # Without it (forks): a throwaway keystore made in the job, so the APK is still
      # signed and installable. Its key changes every run, so updating an installed
      # build needs an uninstall first.
      QT_ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && format('{0}/deploy/android/android_release.keystore', github.workspace) || format('{0}/ci-throwaway.keystore', github.workspace) }}
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && 'QGCAndroidKeyStore' || 'qgcci' }}
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'qgc-ci-throwaway' }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'qgc-ci-throwaway' }}
      QT_ANDROID_HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      # Both ABIs only for tagged releases; branch builds are arm64-only to halve the time.
      QT_ANDROID_ABIS: ${{ github.ref_type == 'tag' && 'armeabi-v7a;arm64-v8a' || 'arm64-v8a' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Create throwaway signing keystore
        if: env.QT_ANDROID_HAS_RELEASE_KEY != 'true'
        run: keytool -genkeypair -v -keystore "$QT_ANDROID_KEYSTORE_PATH" -alias "$QT_ANDROID_KEYSTORE_ALIAS"
              -keyalg RSA -keysize 2048 -validity 3650
              -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" -keypass "$QT_ANDROID_KEYSTORE_KEY_PASS"
              -dname "CN=QGC CI throwaway, O=CI"

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DCMAKE_WARN_DEPRECATED=FALSE
              -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
              -DQT_ANDROID_BUILD_ALL_ABIS=OFF
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
              -DQT_ANDROID_SIGN_APK=${{ env.QT_ANDROID_KEYSTORE_STORE_PASS != '' && 'ON' || 'OFF' }}
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - run: cp ${{ runner.temp }}/shadow_build_dir/android-build/*.apk ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}

      - name: Upload Build File
        if: matrix.BuildType == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy to Play Store
      #   if: matrix.BuildType == 'Release'
      #   uses: ./.github/actions/playstore
      #   with:
      #     artifact_name: ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}
      #     service_account_json: ${{ secrets.SERVICE_ACCOUNT }}
